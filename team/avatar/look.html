<!doctype html><html><body style="margin:0;background:#222"><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {FBXLoader} from 'three/addons/loaders/FBXLoader.js';
const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});r.setSize(1200,800);document.body.appendChild(r.domElement);
const s=new THREE.Scene();s.add(new THREE.HemisphereLight(0xffffff,0x444444,3));const dl=new THREE.DirectionalLight(0xffffff,2);dl.position.set(1,2,3);s.add(dl);
const cam=new THREE.PerspectiveCamera(30,1.5,1,1000);
new FBXLoader().load('../../avatars/Ch36_nonPBR.fbx',o=>{s.add(o);o.updateMatrixWorld(true);
 let mesh;o.traverse(c=>{if(c.isSkinnedMesh)mesh=c;});
 const sk=mesh.skeleton, hi=sk.bones.findIndex(b=>b.name.endsWith('Head'));
 const P=mesh.geometry.attributes.position, SI=mesh.geometry.attributes.skinIndex, SW=mesh.geometry.attributes.skinWeight;
 const bb=new THREE.Box3(), v=new THREE.Vector3(); let n=0;
 for(let i=0;i<P.count;i++){let w=0;for(let k=0;k<4;k++) if(SI.getComponent(i,k)===hi) w+=SW.getComponent(i,k); if(w>0.5){mesh.getVertexPosition(i,v);v.applyMatrix4(mesh.matrixWorld);bb.expandByPoint(v);n++;}}
 window.__info={headVerts:n,box:[bb.min.toArray(),bb.max.toArray()],bindMatrix:mesh.matrixWorld.elements.slice(12,15)};
 window.shot=(mode)=>{ if(mode==='full'){cam.position.set(0,100,450);cam.lookAt(0,95,0);} else if(mode==='head'){cam.position.set(0,165,70);cam.lookAt(0,163,0);} else {cam.position.set(60,168,40);cam.lookAt(0,163,0);} r.render(s,cam); return r.domElement.toDataURL('image/png');};
 window.__ready=1;});
</script></body></html>
